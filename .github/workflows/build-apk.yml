name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Use permanent key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then echo "DEBUG_KEYSTORE secret missing"; exit 1; fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          echo "ANDROID_USER_HOME=$HOME/.android" >> $GITHUB_ENV
      - run: chmod +x gradlew && ./gradlew assembleFossDebug
      - uses: actions/upload-artifact@v5
        with:
          name: gallery-apk
          path: app/build/outputs/apk/foss/debug/*.apk
